# 构建 @w3lib/wallet 的 demo 并发布到 GitHub Pages（https://<owner>.github.io/<repo>/）
# 需要先在仓库 Settings → Pages 里把 Source 设为 “GitHub Actions”
name: Wallet demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'packages/wallet/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/wallet-demo.yml'
  workflow_dispatch:

# 构建只需要读代码；写 Pages 的权限只给部署那一步
permissions:
  contents: read

# 同一时间只部署一次；进行中的部署不取消（避免发布到一半）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 读 package.json 的 packageManager（pnpm 12 需要 v6.1+）
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @w3lib/wallet test
      - run: pnpm --filter @w3lib/wallet demo:build
        env:
          # TON Connect 的 manifest 里要写 demo 实际的地址（用自定义域名时改成那个域名）
          DEMO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/wallet/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
